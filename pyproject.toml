[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-imager-phase3"
version = "0.1.0"
description = "Auditable pilot of retrieval-mediated errors in frozen fMRI captions"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx[socks]==0.28.1", "tiktoken==0.12.0", "Pillow==12.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
brain-imager = "brain_imager_phase3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_imager_phase3 = ["web_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

